[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airdropos"
version = "1.0.0"
description = "AirdropOS: Autonomous AI Agent Platform for Cryptocurrency Airdrops"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AirdropOS Core Team", email = "core@airdropos.internal" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "SQLAlchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "web3>=6.19.0",
    "eth-account>=0.12.3",
    "cryptography>=42.0.7",
    "playwright>=1.48.0",
    "python-telegram-bot>=21.1.1",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
