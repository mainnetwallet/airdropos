services:
  postgres:
    image: postgres:16-alpine
    container_name: airdropos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airdropos
      # Required: set POSTGRES_PASSWORD in .env (openssl rand -hex 24). No default on purpose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}
      POSTGRES_DB: airdropos_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdropos -d airdropos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airdropos_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: airdropos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airdropos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airdropos_db
      REDIS_URL: redis://redis:6379/0
      LIVE_GATEWAY_URL: http://worker:8765
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: airdropos_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airdropos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airdropos_db
      REDIS_URL: redis://redis:6379/0
      # Reachable by the backend container only (no `ports:` entry on purpose).
      # Needs LIVE_GATEWAY_SECRET or a custom SECRET_KEY in .env; the worker refuses to start
      # the gateway on a non-loopback address otherwise. Every request also needs the shared secret.
      # The worker's browser refuses internal Docker service names and private addresses unless
      # BROWSER_ALLOW_PRIVATE_NETWORK=true; an egress firewall on this container is still advised.
      LIVE_GATEWAY_HOST: 0.0.0.0
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: ["python", "-m", "backend.app.scheduler.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airdropos_frontend
    restart: unless-stopped
    ports:
      # Reachable on all interfaces by default (RUNNING.md VPS setup). The UI is plain HTTP, so
      # prefer FRONTEND_BIND=127.0.0.1 in .env with a TLS reverse proxy or an SSH tunnel.
      - "${FRONTEND_BIND:-0.0.0.0}:3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/api/v1/ws

volumes:
  postgres_data:
  redis_data:
